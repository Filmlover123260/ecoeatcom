    <script>
      // Ensure all link tags dynamically retain absolute paths starting with https://
      (function() {
        try {
          var origin = window.location.origin.replace(/^http:\/\//, 'https://');
          var links = document.querySelectorAll('link[href]');
          links.forEach(function(el) {
            var rawHref = el.getAttribute('href');
            if (rawHref && !rawHref.startsWith('https://')) {
              el.setAttribute('href', origin + (rawHref.startsWith('/') ? '' : '/') + rawHref);
            }
          });
        } catch (e) {}
      })();
    </script>
    <title>EcoEat - Campus Sustainability & Food Waste Tracker</title>
    <meta name="description" content="EcoEat - Sustainable campus dining, food waste tracking, AI meal detection, and gamified student eco-challenges for school campuses." />

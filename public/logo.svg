<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" fill="none">
  <defs>
    <!-- Inner Shield Clip Boundary -->
    <clipPath id="innerShield">
      <path d="M 40 24
               L 460 24
               L 460 330
               C 460 430 355 498 250 532
               C 145 498 40 430 40 330
               Z" />
    </clipPath>
  </defs>

  <!-- Outer Base Shield (Teal) -->
  <path d="M 18 10
           L 482 10
           L 482 340
           C 482 455 370 530 250 568
           C 130 530 18 455 18 340
           Z"
        fill="#0da19c" />

  <!-- Shield Interior Clipped Graphic -->
  <g clip-path="url(#innerShield)">
    <!-- Base Teal Fill for the entire inner field (provides Top-Left and Bottom-Right teal quadrants) -->
    <rect x="0" y="0" width="500" height="580" fill="#0da19c" />

    <!-- Top-Right Quadrant: Crisp White -->
    <rect x="302" y="24" width="160" height="142" fill="#ffffff" />

    <!-- Bottom-Left Quadrant: Crisp White -->
    <rect x="40" y="258" width="160" height="280" fill="#ffffff" />

    <!-- Dark Navy Cross: Horizontal Bar -->
    <rect x="40" y="164" width="420" height="96" fill="#0b2444" />

    <!-- Dark Navy Cross: Vertical Bar ending in pointed tip -->
    <path d="M 198 24
             L 302 24
             L 302 516
             L 250 534
             L 198 516
             Z"
          fill="#0b2444" />

    <!-- Open Book in the Center of the Cross -->
    <g id="crest-open-book">
      <!-- Dark Navy Book Cover / Underlay Shadow -->
      <!-- Left Cover Tab / Edge -->
      <path d="M 246 112
               L 118 94
               L 118 296
               L 246 318
               Z"
            fill="#08182b" />
      <!-- Right Cover Tab / Edge -->
      <path d="M 254 112
               L 382 94
               L 382 296
               L 254 318
               Z"
            fill="#08182b" />
      <!-- Bottom Center Spine Tab -->
      <path d="M 244 316 L 250 326 L 256 316 Z" fill="#08182b" />

      <!-- Left Page (White with dark navy outline) -->
      <path d="M 246 122
               L 128 104
               L 128 286
               L 246 308
               Z"
            fill="#ffffff"
            stroke="#0b2444"
            stroke-width="11"
            stroke-linejoin="round" />

      <!-- Right Page (White with dark navy outline) -->
      <path d="M 254 122
               L 372 104
               L 372 286
               L 254 308
               Z"
            fill="#ffffff"
            stroke="#0b2444"
            stroke-width="11"
            stroke-linejoin="round" />

      <!-- Center Book Spine Line -->
      <line x1="250" y1="114" x2="250" y2="314" stroke="#0b2444" stroke-width="8" stroke-linecap="round" />

      <!-- Chinese Character: 培 (Left Page, Navy) -->
      <text x="187" y="210"
            font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', 'SimSun', serif"
            font-size="62"
            font-weight="900"
            fill="#0b2444"
            text-anchor="middle"
            dominant-baseline="central">培</text>

      <!-- Chinese Character: 民 (Right Page, Navy) -->
      <text x="313" y="210"
            font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', 'SimSun', serif"
            font-size="62"
            font-weight="900"
            fill="#0b2444"
            text-anchor="middle"
            dominant-baseline="central">民</text>
    </g>

    <!-- BBS Typography Across Lower Half -->
    <!-- First 'B' (Dark Navy on White Bottom-Left Quadrant) -->
    <text x="142" y="445"
          font-family="'Times New Roman', 'Playfair Display', 'Georgia', serif"
          font-size="124"
          font-weight="900"
          fill="#0b2444"
          text-anchor="middle">B</text>

    <!-- Middle 'B' (Crisp White on Dark Navy Vertical Crossbar) -->
    <text x="250" y="445"
          font-family="'Times New Roman', 'Playfair Display', 'Georgia', serif"
          font-size="124"
          font-weight="900"
          fill="#ffffff"
          text-anchor="middle">B</text>

    <!-- 'S' (Dark Navy on Teal Bottom-Right Quadrant) -->
    <text x="358" y="445"
          font-family="'Times New Roman', 'Playfair Display', 'Georgia', serif"
          font-size="124"
          font-weight="900"
          fill="#0b2444"
          text-anchor="middle">S</text>
  </g>
</svg>
